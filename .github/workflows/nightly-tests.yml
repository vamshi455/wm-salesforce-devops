name: Nightly tests (Integration)
on:
  schedule: [{ cron: '0 7 * * *' }]   # 01:00 Central
  workflow_dispatch:
jobs:
  run-local-tests:
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sf-setup
        with:
          alias: integration
          client-id: ${{ secrets.SF_CLIENT_ID }}
          username: ${{ vars.SF_USERNAME }}
          jwt-key: ${{ secrets.SF_JWT_KEY }}
          instance-url: ${{ vars.SF_INSTANCE_URL }}
      - run: sf apex run test --test-level RunLocalTests --code-coverage --result-format human --target-org integration --wait 120
